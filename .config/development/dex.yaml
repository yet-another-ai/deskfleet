# Public, local-only credentials. The browser and host backend use this issuer.
issuer: http://127.0.0.1:5556/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/deskfleet.db
web:
  http: 0.0.0.0:5556
oauth2:
  grantTypes: [authorization_code]
  responseTypes: [code]
  skipApprovalScreen: true
  pkce:
    enforce: true
    codeChallengeMethodsSupported: [S256]
staticClients:
  - id: deskfleet-dev
    name: deskfleet local development
    secret: deskfleet-dev-client-secret
    redirectURIs:
      - http://127.0.0.1:8080/api/auth/callback
enablePasswordDB: true
staticPasswords:
  # Both accounts use "password". Team roles are assigned by deskfleet,
  # independently of these OIDC identities: create a team, then invite Bob.
  - email: alice@example.test
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: alice
    name: Alice Developer
    emailVerified: true
    userID: 00000000-0000-4000-8000-000000000001
  - email: bob@example.test
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: bob
    name: Bob Developer
    emailVerified: true
    userID: 00000000-0000-4000-8000-000000000002
signer:
  type: local
  config:
    algorithm: RS256
    keysRotationPeriod: 6h
