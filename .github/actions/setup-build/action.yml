name: Setup DeskFleet build
description: Install locked tools and dependencies with shared build caches.

inputs:
  github-token:
    description: Token used by mise when downloading tools from GitHub.
    required: false
    default: ""
  cache-rust-build:
    description: >-
      Cache the Cargo target directory between runs. Enable for check and test
      jobs that rebuild the same profiles; leave it disabled for release
      packaging so the repository cache quota stays available for the compiler
      cache.
    required: false
    default: "false"

outputs:
  electron-path:
    description: Electron package download directory for this runner.
    value: ${{ steps.cache-paths.outputs.electron-path }}
  electron-cache-key:
    description: Primary key for the Electron download cache.
    value: ${{ steps.electron-downloads.outputs.cache-primary-key }}
  electron-cache-hit:
    description: Whether the Electron download cache restored an exact match.
    value: ${{ steps.electron-downloads.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # nodejs.org throttles the darwin Node archive from GitHub-hosted macOS
    # runners (a few KiB/s until mise's download budget expires). Rewrite only
    # that host. mise.lock keeps the upstream URL and checksum, and mise
    # checks the bytes it receives against that checksum.
    - name: Mirror Node downloads on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: echo 'MISE_URL_REPLACEMENTS={"https://nodejs.org/dist/":"https://cdn.npmmirror.com/binaries/node/"}' >> "$GITHUB_ENV"

    - name: Install locked toolchain
      uses: jdx/mise-action@v5
      with:
        version: 2026.10.21
        install_args: --locked
        cache: true
        # Restore main's tool cache everywhere, but let only main and tags
        # write it. Pull-request merge refs only consume the shared cache quota.
        cache_save: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
        # HTTP 429 is otherwise reported as a cache miss, and the job then
        # downloads the toolchain.
        cache_restore_retry_budget: 120s
        cache_save_retry_budget: 120s
        # An explicit empty input suppresses mise-action's automatic token default.
        github_token: ${{ inputs.github-token }}

    - name: Locate LLVM for NVENC bindings
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
        if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
          throw 'NVENC bindings require LLVM with libclang.dll'
        }
        "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore Cargo target directory
      if: inputs.cache-rust-build == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        # Warm caches come from main. Pull requests restore that baseline
        # without competing for the repository cache quota.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Configure compiler cache
      shell: bash
      env:
        CACHE_ERROR_LOG: ${{ runner.temp }}/deskfleet-sccache-errors.log
      run: |
        # Actions objects per compilation evict the Cargo target cache.
        echo "SCCACHE_GHA_ENABLED=off" >> "$GITHUB_ENV"
        printf 'SCCACHE_ERROR_LOG=%s\n' "$CACHE_ERROR_LOG" >> "$GITHUB_ENV"
        echo "SCCACHE_LOG=warn" >> "$GITHUB_ENV"

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.19.0

    - name: Enable compiler caching
      shell: bash
      run: printf 'RUSTC_WRAPPER=%s\n' "${SCCACHE_PATH:-sccache}" >> "$GITHUB_ENV"

    - name: Locate Cargo, pnpm, and Electron caches
      id: cache-paths
      shell: bash
      run: |
        node --input-type=module <<'EOF'
        import { execFileSync } from "node:child_process"
        import { appendFileSync } from "node:fs"
        import { homedir, platform } from "node:os"
        import { join } from "node:path"

        const home = homedir()
        const output = process.env.GITHUB_OUTPUT
        const cargoHome = process.env.CARGO_HOME ?? join(home, ".cargo")
        const pnpmStore = execFileSync("pnpm", ["store", "path", "--silent"], { encoding: "utf8" }).trim()
        const localAppData = process.env.LOCALAPPDATA || join(home, "AppData", "Local")
        const electron = platform() === "darwin"
          ? join(home, "Library", "Caches", "electron")
          : platform() === "win32"
            ? join(localAppData, "electron", "Cache")
            : join(home, ".cache", "electron")
        appendFileSync(output, `cargo-home=${cargoHome}\n`)
        appendFileSync(output, `pnpm-store=${pnpmStore}\n`)
        appendFileSync(output, `electron-path=${electron}\n`)
        EOF

    - name: Restore Cargo downloads
      id: cargo-downloads
      # rust-cache already caches the registry and git databases.
      if: inputs.cache-rust-build != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/index
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/cache
          ${{ steps.cache-paths.outputs.cargo-home }}/git/db
        key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

    - name: Fetch locked Rust dependencies
      if: inputs.cache-rust-build != 'true'
      shell: bash
      run: cargo fetch --locked

    - name: Save Cargo downloads
      # Pull requests read main's entry through the base-branch fallback.
      # Their merge-ref copy would spend the repository cache quota.
      if: >-
        inputs.cache-rust-build != 'true' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
        steps.cargo-downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/index
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/cache
          ${{ steps.cache-paths.outputs.cargo-home }}/git/db
        key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

    - name: Restore pnpm store
      id: pnpm-store
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Electron downloads
      id: electron-downloads
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-paths.outputs.electron-path }}
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

    - name: Install workspace dependencies
      shell: bash
      run: mise run install

    - name: Save pnpm store
      if: >-
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
        steps.pnpm-store.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: ${{ steps.pnpm-store.outputs.cache-primary-key }}
