name: Setup DeskFleet build
description: Install locked tools and dependencies and restore shared Cargo build outputs.

inputs:
  github-token:
    description: Token used by mise when downloading tools from GitHub.
    required: false
    default: ""
  tools:
    description: >-
      Space-separated locked mise tools to install, such as `node pnpm rust cmake`.
      Leave empty to install every locked tool.
    required: false
    default: ""
  install-native-deps:
    description: >-
      Whether to install Linux native desktop viewer dev libraries and locate
      Windows LLVM libclang. Disable for jobs that do not compile native desktop
      Rust targets.
    required: false
    default: "true"
  rust-cache:
    description: >-
      Cargo target cache role, such as `test` or `release`. Jobs
      with the same role and OS share one entry, so give a role only to jobs
      that build the same profiles and feature sets. Leave empty to skip the
      Cargo cache.
    required: false
    default: ""
  rust-cache-save:
    description: >-
      Whether this job may write its role's entry on main. Disable it for jobs
      that only reuse another job's target directory, and for builds that would
      add entries the quota cannot hold.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install locked toolchain
      uses: ./.github/actions/setup-mise
      with:
        tools: ${{ inputs.tools }}
        github-token: ${{ inputs.github-token }}

    - name: Locate LLVM for NVENC bindings
      if: runner.os == 'Windows' && inputs.install-native-deps == 'true'
      shell: pwsh
      run: |
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
        if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
          throw 'NVENC bindings require LLVM with libclang.dll'
        }
        "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install native viewer build libraries
      if: runner.os == 'Linux' && inputs.install-native-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          pkg-config libfontconfig1-dev libfreetype6-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev

    # rust-cache keys include the OS, architecture, Rust toolchain, CARGO_* and
    # RUST* environment, and lockfiles. mise.ci.toml gives every job the same
    # Cargo environment, so jobs of one role resolve to the same key.
    - name: Restore Cargo target directory
      id: rust-cache
      if: inputs.rust-cache != ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache }}
        add-job-id-key: false
        # Warm caches come from main. Pull requests restore that baseline
        # without competing for the repository cache quota. A failed test
        # leaves valid build outputs, so save them anyway.
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.rust-cache-save == 'true' }}
        cache-on-failure: true

    - name: Install workspace dependencies
      shell: bash
      run: mise run install

    - name: Summarize Cargo cache restore
      if: inputs.rust-cache != ''
      shell: bash
      env:
        RUST_ROLE: ${{ inputs.rust-cache }}
        RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      run: |
        if [[ "$RUST_HIT" == true ]]; then
          result=exact
        else
          result='fallback or miss'
        fi
        printf 'Cargo target cache (%s, %s %s) — %s\n' "$RUST_ROLE" "$RUNNER_OS" "$RUNNER_ARCH" "$result" >> "$GITHUB_STEP_SUMMARY"
