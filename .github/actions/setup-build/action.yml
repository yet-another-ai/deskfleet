name: Setup deskfleet build
description: Install locked tools and dependencies with shared build caches.

inputs:
  github-token:
    description: Token for mise tool downloads. Leave empty for pull requests.
    required: false
    default: ""
  cache-rust-build:
    description: Restore Cargo target artifacts for checks; release builds use compiler caching only.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Locate LLVM for NVENC bindings
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
        if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
          throw 'NVENC bindings require LLVM with libclang.dll'
        }
        "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install locked tools
      uses: jdx/mise-action@v5.2.3
      with:
        version: 2026.10.19
        install_args: --locked
        cache: true
        cache_save: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
        github_token: ${{ inputs.github-token }}

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'mise.lock') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

    - name: Install workspace dependencies
      shell: bash
      run: mise run install

    - name: Save pnpm store
      if: >-
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
        steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

    - name: Restore Cargo build cache
      if: inputs.cache-rust-build == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Configure shared compiler cache
      shell: bash
      env:
        CACHE_MODE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "SCCACHE_GHA_RW_MODE=$CACHE_MODE"
        } >> "$GITHUB_ENV"

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0

    - name: Enable compiler caching
      shell: bash
      run: echo "RUSTC_WRAPPER=${SCCACHE_PATH:-sccache}" >> "$GITHUB_ENV"

    - name: Locate Cargo downloads
      id: paths
      if: inputs.cache-rust-build != 'true'
      shell: bash
      run: echo "cargo-home=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"

    - name: Restore Cargo downloads
      id: downloads
      if: inputs.cache-rust-build != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.paths.outputs.cargo-home }}/registry/index
          ${{ steps.paths.outputs.cargo-home }}/registry/cache
          ${{ steps.paths.outputs.cargo-home }}/git/db
        key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

    - name: Fetch locked Rust dependencies
      if: inputs.cache-rust-build != 'true'
      shell: bash
      run: cargo fetch --locked

    - name: Save Cargo downloads
      if: >-
        inputs.cache-rust-build != 'true' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
        steps.downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.paths.outputs.cargo-home }}/registry/index
          ${{ steps.paths.outputs.cargo-home }}/registry/cache
          ${{ steps.paths.outputs.cargo-home }}/git/db
        key: ${{ steps.downloads.outputs.cache-primary-key }}
