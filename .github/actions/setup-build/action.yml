name: Setup DeskFleet build
description: Install locked tools and dependencies with shared build caches.

inputs:
  github-token:
    description: Token used by mise when downloading tools from GitHub.
    required: false
    default: ""
  rust-cache:
    description: >-
      Cargo target cache role, such as `static`, `test`, or `release`. Jobs
      with the same role and OS share one entry, so give a role only to jobs
      that build the same profiles and feature sets. Leave empty to cache only
      Cargo downloads.
    required: false
    default: ""
  rust-cache-save:
    description: >-
      Whether this job may write its role's entry on main. Disable it for jobs
      that only reuse another job's target directory, and for builds that would
      add entries the quota cannot hold.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install locked toolchain
      id: mise
      uses: ./.github/actions/setup-mise
      with:
        github-token: ${{ inputs.github-token }}

    - name: Locate LLVM for NVENC bindings
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
        if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
          throw 'NVENC bindings require LLVM with libclang.dll'
        }
        "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install native viewer build libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          pkg-config libfontconfig1-dev libfreetype6-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev

    # rust-cache keys include the OS, architecture, Rust toolchain, CARGO_* and
    # RUST* environment, and lockfiles. mise.ci.toml gives every job the same
    # Cargo environment, so jobs of one role resolve to the same key.
    - name: Restore Cargo target directory
      id: rust-cache
      if: inputs.rust-cache != ''
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache }}
        add-job-id-key: false
        # Warm caches come from main. Pull requests restore that baseline
        # without competing for the repository cache quota. A failed test
        # leaves valid build outputs, so save them anyway.
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.rust-cache-save == 'true' }}
        cache-on-failure: true

    - name: Locate Cargo, pnpm, and Electron caches
      id: cache-paths
      shell: bash
      run: |
        node --input-type=module <<'EOF'
        import { execFileSync } from "node:child_process"
        import { appendFileSync, readFileSync } from "node:fs"
        import { homedir, platform } from "node:os"
        import { join } from "node:path"

        const home = homedir()
        const output = process.env.GITHUB_OUTPUT
        const cargoHome = process.env.CARGO_HOME ?? join(home, ".cargo")
        const pnpmStore = execFileSync("pnpm", ["store", "path", "--silent"], { encoding: "utf8" }).trim()
        const localAppData = process.env.LOCALAPPDATA || join(home, "AppData", "Local")
        const electron = platform() === "darwin"
          ? join(home, "Library", "Caches", "electron")
          : platform() === "win32"
            ? join(localAppData, "electron", "Cache")
            : join(home, ".cache", "electron")
        // Key Electron downloads by the locked Electron version, not the whole
        // lockfile: unrelated dependency updates must not refetch the archive.
        const electronVersion = readFileSync("pnpm-lock.yaml", "utf8").match(/^  electron@([^:(\s]+):$/m)?.[1]
        if (!electronVersion) throw new Error("pnpm-lock.yaml does not lock electron")
        appendFileSync(output, `cargo-home=${cargoHome}\n`)
        appendFileSync(output, `pnpm-store=${pnpmStore}\n`)
        appendFileSync(output, `electron-path=${electron}\n`)
        appendFileSync(output, `electron-version=${electronVersion}\n`)
        EOF

    - name: Restore Cargo downloads
      id: cargo-downloads
      # rust-cache already caches the registry and git databases.
      if: inputs.rust-cache == ''
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/index
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/cache
          ${{ steps.cache-paths.outputs.cargo-home }}/git/db
        key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

    - name: Fetch locked Rust dependencies
      if: inputs.rust-cache == ''
      shell: bash
      run: cargo fetch --locked

    - name: Save Cargo downloads
      # Pull requests and tags read main's entry through the base-branch
      # fallback. Their own copies would only spend the repository cache quota.
      if: >-
        inputs.rust-cache == '' &&
        github.ref == 'refs/heads/main' &&
        steps.cargo-downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/index
          ${{ steps.cache-paths.outputs.cargo-home }}/registry/cache
          ${{ steps.cache-paths.outputs.cargo-home }}/git/db
        key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

    - name: Restore pnpm store
      id: pnpm-store
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Electron downloads
      id: electron-downloads
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-paths.outputs.electron-path }}
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.electron-version }}

    - name: Install workspace dependencies
      shell: bash
      run: mise run install

    # Offline DSH deployment still needs the original package snapshots after
    # install. Store pruning can remove them even while node_modules is intact.
    - name: Save pnpm store
      if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: ${{ steps.pnpm-store.outputs.cache-primary-key }}

    # Electron's install script is disabled in pnpm-workspace.yaml; jobs fetch
    # the archive on first use. Fetch it here on a main miss so every OS gets
    # an entry, whichever job happens to need Electron later.
    - name: Download Electron for the cache
      if: github.ref == 'refs/heads/main' && steps.electron-downloads.outputs.cache-hit != 'true'
      shell: bash
      run: mise exec -- pnpm --filter @deskfleet/desktop exec install-electron

    - name: Save Electron downloads
      if: github.ref == 'refs/heads/main' && steps.electron-downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.cache-paths.outputs.electron-path }}
        key: ${{ steps.electron-downloads.outputs.cache-primary-key }}

    # Compare cache effectiveness across runs without opening each log.
    - name: Summarize cache restores
      shell: bash
      env:
        MISE_HIT: ${{ steps.mise.outputs.cache-hit }}
        RUST_ROLE: ${{ inputs.rust-cache }}
        RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        CARGO_HIT: ${{ steps.cargo-downloads.outputs.cache-hit }}
        CARGO_MATCH: ${{ steps.cargo-downloads.outputs.cache-matched-key }}
        PNPM_HIT: ${{ steps.pnpm-store.outputs.cache-hit }}
        PNPM_MATCH: ${{ steps.pnpm-store.outputs.cache-matched-key }}
        ELECTRON_HIT: ${{ steps.electron-downloads.outputs.cache-hit }}
      run: |
        result() {
          if [[ "$1" == true ]]; then echo exact
          elif [[ -n "$2" ]]; then echo "fallback \`$2\`"
          else echo miss
          fi
        }
        {
          echo "### Cache restores: $GITHUB_JOB ($RUNNER_OS $RUNNER_ARCH)"
          echo
          echo "| Cache | Result |"
          echo "| --- | --- |"
          echo "| mise tools | $(result "$MISE_HIT") |"
          if [[ -n "$RUST_ROLE" ]]; then
            echo "| Cargo target (\`$RUST_ROLE\`) | $([[ "$RUST_HIT" == true ]] && echo exact || echo 'fallback or miss') |"
          else
            echo "| Cargo downloads | $(result "$CARGO_HIT" "$CARGO_MATCH") |"
          fi
          echo "| pnpm store | $(result "$PNPM_HIT" "$PNPM_MATCH") |"
          echo "| Electron | $(result "$ELECTRON_HIT") |"
        } >> "$GITHUB_STEP_SUMMARY"
