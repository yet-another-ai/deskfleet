name: Setup DeskFleet mise
description: Install locked mise tools with the CI environment and a main-only tool cache.

inputs:
  tools:
    description: >-
      Space-separated tools to install, such as `node`. Leave empty to install
      every locked tool. mise-action keys its cache by this list, so a partial
      install never replaces the full toolchain entry.
    required: false
    default: ""
  github-token:
    description: Token used by mise when downloading tools from GitHub.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether mise restored its tool cache.
    value: ${{ steps.mise.outputs.cache-hit == 'true' || steps.mise-retry.outputs.cache-hit == 'true' }}

runs:
  using: composite
  steps:
    # `MISE_ENV=ci` loads mise.ci.toml and is part of mise-action's cache key.
    # It must be set before the first mise invocation.
    - name: Select the CI mise environment
      shell: bash
      run: echo "MISE_ENV=ci" >> "$GITHUB_ENV"

    # nodejs.org throttles the darwin Node archive from GitHub-hosted macOS
    # runners (a few KiB/s until mise's download budget expires). Rewrite only
    # that host. mise.lock keeps the upstream URL and checksum, and mise
    # checks the bytes it receives against that checksum.
    - name: Mirror Node downloads on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: echo 'MISE_URL_REPLACEMENTS={"https://nodejs.org/dist/":"https://cdn.npmmirror.com/binaries/node/"}' >> "$GITHUB_ENV"

    # Hosted macOS runners occasionally SIGKILL rustup during the first mise
    # install (Cluster C). Retry once before failing the job; real toolchain
    # problems still fail on the second attempt.
    - name: Install locked toolchain
      id: mise
      continue-on-error: true
      uses: jdx/mise-action@v5
      with:
        version: 2026.11.3
        install_args: --locked ${{ inputs.tools }}
        cache: true
        # Every ref restores main's tool cache; only main writes it. Pull
        # requests and tags cannot share their entries, which would only
        # spend the repository cache quota.
        cache_save: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        # HTTP 429 is otherwise reported as a cache miss, and the job then
        # downloads the toolchain.
        cache_restore_retry_budget: 120s
        cache_save_retry_budget: 120s
        # An explicit empty input suppresses mise-action's automatic token default.
        github_token: ${{ inputs.github-token }}

    - name: Retry locked toolchain install
      id: mise-retry
      if: steps.mise.outcome == 'failure'
      uses: jdx/mise-action@v5
      with:
        version: 2026.11.3
        install_args: --locked ${{ inputs.tools }}
        cache: true
        cache_save: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        cache_restore_retry_budget: 120s
        cache_save_retry_budget: 120s
        github_token: ${{ inputs.github-token }}

    - name: Require locked toolchain
      if: steps.mise.outcome == 'failure' && steps.mise-retry.outcome != 'success'
      shell: bash
      run: |
        echo "::error::Locked toolchain install failed after one retry."
        exit 1
