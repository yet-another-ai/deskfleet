name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_smoke_build:
        description: Build Linux x64 only when called for a pull request.
        type: boolean
        required: false
        default: false
      production_release:
        description: Use the production environment and sign macOS installers for a validated tag release.
        type: boolean
        required: false
        default: false
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Disable incremental compilation so sccache can cache every rustc invocation.
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.production_release && 'production' || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pr_smoke_build && github.event_name == 'pull_request' && '[{"platform":"linux-x64","os":"ubuntu-24.04"}]' || '[{"platform":"linux-x64","os":"ubuntu-24.04"},{"platform":"linux-arm64","os":"ubuntu-24.04-arm"},{"platform":"macos-arm64","os":"macos-latest"},{"platform":"windows-x64","os":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use faster release profile for packaging builds
        shell: bash
        run: |
          {
            echo "CARGO_PROFILE_RELEASE_LTO=false"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            echo "CARGO_PROFILE_RELEASE_DEBUG=0"
            echo "CARGO_PROFILE_RELEASE_STRIP=symbols"
          } >> "$GITHUB_ENV"

      - name: Disable MSVC PDB generation for release builds
        if: runner.os == 'Windows'
        shell: pwsh
        # rustc still passes /DEBUG with debug=0 and strip=symbols on MSVC.
        # Match this release profile without requiring vendored OpenSSL's PDB.
        run: '"CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C link-arg=/DEBUG:NONE" >> $env:GITHUB_ENV'

      - name: Set up build environment
        id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

      - name: Build the server, daemon, Web client, and Electron bundles
        if: ${{ !inputs.production_release }}
        run: mise run ci:build

      - name: Validate production release configuration
        if: ${{ inputs.production_release }}
        shell: bash
        env:
          DESKTOP_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
        run: |
          if [[ -z "$DESKTOP_SERVER_URL" ]]; then
            echo "::error::Set VITE_DESKFLEET_SERVER_URL in the production environment before publishing."
            exit 1
          fi

      # Keep the runner's native shell so Windows uses Strawberry Perl for OpenSSL.
      - name: Build production server, daemon, and Web bundles
        if: ${{ inputs.production_release }}
        env:
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
        run: mise run build

      - name: Build production Electron bundles
        if: ${{ inputs.production_release }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
        # Keep Web same-origin; reuse the release addon for Electron's API-specific build.
        run: mise exec -- pnpm --filter @deskfleet/desktop build

      - name: Package unsigned desktop installers
        if: ${{ runner.os != 'macOS' || !inputs.production_release }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: mise exec -- pnpm --filter @deskfleet/desktop run package

      - name: Prepare macOS notarization key
        id: macos_credentials
        if: ${{ runner.os == 'macOS' && inputs.production_release }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, writeFileSync } from "node:fs"
          import { join } from "node:path"
          for (const name of ["MAC_CSC_LINK", "MAC_CSC_KEY_PASSWORD", "APPLE_API_KEY_P8", "APPLE_API_KEY_ID", "APPLE_API_ISSUER"]) {
            if (!process.env[name]) throw new Error(`Missing required release secret: ${name}`)
          }
          const keyPath = join(process.env.RUNNER_TEMP, "deskfleet-notarization.p8")
          writeFileSync(keyPath, Buffer.from(process.env.APPLE_API_KEY_P8, "base64"), { mode: 0o600 })
          appendFileSync(process.env.GITHUB_OUTPUT, `key_path=${keyPath}\n`)
          EOF

      - name: Sign and notarize macOS desktop installers
        if: ${{ runner.os == 'macOS' && inputs.production_release }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.macos_credentials.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: mise exec -- pnpm --filter @deskfleet/desktop exec electron-builder --config electron-builder.release.yml --publish never

      - name: Remove macOS notarization key
        if: ${{ always() && runner.os == 'macOS' && inputs.production_release }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/deskfleet-notarization.p8"

      - name: Verify the Linux server and Web image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
          esac
          mkdir -p "image-context/$arch" image-context/web
          host_target=$(mise exec -- rustc --print host-tuple)
          cp "target/$host_target/release/deskfleet-server" "image-context/$arch/"
          cp -R apps/web/dist/. image-context/web/
          docker build --platform "linux/$arch" -f apps/server/Dockerfile -t deskfleet-server:smoke image-context
          mise exec -- node scripts/smoke-server-image.ts deskfleet-server:smoke

      - name: Verify the standalone daemon
        run: mise run daemon:smoke

      - name: Stage artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) extension=.exe ;;
            *) extension= ;;
          esac
          host_target=$(mise exec -- rustc --print host-tuple)
          cp "target/$host_target/release/deskfleet-server$extension" dist/
          cp "apps/daemon/dist/deskfleet-daemon$extension" dist/
          tar -czf "deskfleet-$PLATFORM.tar.gz" -C dist .

      - name: Upload server and daemon artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-${{ matrix.platform }}
          path: deskfleet-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Web client
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Report shared compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache
