name: Build

on:
  workflow_dispatch:
    inputs:
      signed_ios:
        description: Build only a signed iOS IPA using production credentials, without uploading to TestFlight.
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      smoke_build:
        description: Build Linux x64 only for ordinary PR and main CI runs.
        type: boolean
        required: false
        default: false
      production_release:
        description: Use the production environment and sign macOS installers for a validated tag release.
        type: boolean
        required: false
        default: false
      signed_ios:
        description: Build only a signed iOS IPA without publishing.
        type: boolean
        required: false
        default: false
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_TEAM_ID:
        required: false
      IOS_DIST_CERT_P12:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  package:
    if: ${{ !inputs.signed_ios }}
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.production_release && 'production' || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux release binaries link against the build host's glibc. Keep these
        # two builds on the oldest supported Ubuntu LTS so the packages still
        # install on it; every other Linux job uses the newest Ubuntu image.
        include: ${{ fromJSON(inputs.smoke_build && '[{"platform":"linux-x64","os":"ubuntu-24.04"}]' || '[{"platform":"linux-x64","os":"ubuntu-24.04"},{"platform":"linux-arm64","os":"ubuntu-24.04-arm"},{"platform":"macos-arm64","os":"macos-latest"},{"platform":"windows-x64","os":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Disable MSVC PDB generation for release builds
        if: runner.os == 'Windows'
        shell: pwsh
        # rustc still passes /DEBUG with mise.ci.toml's debug=0 and
        # strip=symbols on MSVC. Match that release profile without requiring
        # vendored OpenSSL's PDB.
        run: '"CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C link-arg=/DEBUG:NONE" >> $env:GITHUB_ENV'

      - name: Set up build environment
        id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          # Main's Linux x64 smoke build keeps a release target entry for later
          # smoke builds; full builds only restore it, so other platforms do not
          # take quota. Production releases build without a target cache.
          rust-cache: ${{ !inputs.production_release && 'release' || '' }}
          rust-cache-save: ${{ inputs.smoke_build }}

      - name: Build the server, daemon, Web client, and Electron bundles
        if: ${{ !inputs.production_release }}
        run: mise run ci:build

      - name: Validate production release configuration
        if: ${{ inputs.production_release }}
        shell: bash
        env:
          DESKTOP_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
        run: |
          if [[ -z "$DESKTOP_SERVER_URL" ]]; then
            echo "::error::Set VITE_DESKFLEET_SERVER_URL in the production environment before publishing."
            exit 1
          fi

      # Keep the runner's native shell so Windows uses Strawberry Perl for OpenSSL.
      - name: Build production server, daemon, and Web bundles
        if: ${{ inputs.production_release }}
        env:
          DESKFLEET_SOURCEMAPS: "1"
          VITE_SENTRY_DIST: web
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
        run: mise run build

      - name: Build production Electron bundles
        if: ${{ inputs.production_release }}
        env:
          DESKFLEET_SOURCEMAPS: "1"
          VITE_SENTRY_DIST: ${{ matrix.platform }}
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
        # Keep Web same-origin; reuse the release addon for Electron's API-specific build.
        run: mise exec -- pnpm --filter @deskfleet/desktop build

      - name: Upload release source maps and remove public maps
        if: ${{ inputs.production_release }}
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: mise exec -- node scripts/sentry-sourcemaps.ts ${{ matrix.platform }}

      - name: Package unsigned desktop installers
        if: ${{ runner.os != 'macOS' || !inputs.production_release }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DESKFLEET_NATIVE_PREBUILT: "1"
        # Linux smoke builds produce only the tar.gz payload that Linux packages
        # and Nix consume. Full builds keep every configured target.
        run: >-
          mise exec -- pnpm --filter @deskfleet/desktop run package
          ${{ inputs.smoke_build && runner.os == 'Linux' && '--linux tar.gz' || '' }}

      - name: Prepare macOS notarization key
        id: macos_credentials
        if: ${{ runner.os == 'macOS' && inputs.production_release }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, writeFileSync } from "node:fs"
          import { join } from "node:path"
          for (const name of ["MAC_CSC_LINK", "MAC_CSC_KEY_PASSWORD", "APPLE_API_KEY_P8", "APPLE_API_KEY_ID", "APPLE_API_ISSUER"]) {
            if (!process.env[name]) throw new Error(`Missing required release secret: ${name}`)
          }
          const keyPath = join(process.env.RUNNER_TEMP, "deskfleet-notarization.p8")
          writeFileSync(keyPath, Buffer.from(process.env.APPLE_API_KEY_P8, "base64"), { mode: 0o600 })
          appendFileSync(process.env.GITHUB_OUTPUT, `key_path=${keyPath}\n`)
          EOF

      - name: Sign and notarize macOS desktop installers
        if: ${{ runner.os == 'macOS' && inputs.production_release }}
        env:
          DESKFLEET_NATIVE_PREBUILT: "1"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.macos_credentials.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Stage native executables through the shared packaging script before signing.
        run: mise exec -- pnpm --filter @deskfleet/desktop run package --config electron-builder.release.yml

      - name: Remove macOS notarization key
        if: ${{ always() && runner.os == 'macOS' && inputs.production_release }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/deskfleet-notarization.p8"

      - name: Verify the Linux server and Web image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
          esac
          mkdir -p "image-context/$arch" image-context/web
          host_target=$(mise exec -- rustc --print host-tuple)
          cp "target/$host_target/release/deskfleet-server" "image-context/$arch/"
          cp -R apps/web/dist/. image-context/web/
          docker build --platform "linux/$arch" -f apps/server/Dockerfile -t deskfleet-server:smoke image-context
          mise exec -- node scripts/smoke-server-image.ts deskfleet-server:smoke

      - name: Verify the standalone daemon
        run: mise run daemon:smoke

      - name: Verify packaged DeepSeek Harness
        run: mise run desktop:smoke-packaged-dsh

      - name: Stage artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) extension=.exe ;;
            *) extension= ;;
          esac
          host_target=$(mise exec -- rustc --print host-tuple)
          cp "target/$host_target/release/deskfleet-server$extension" dist/
          cp "apps/daemon/dist/deskfleet-daemon$extension" dist/
          cp -R apps/daemon/dist/dsh dist/dsh
          tar -czf "deskfleet-$PLATFORM.tar.gz" -C dist .

      - name: Upload server and daemon artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-${{ matrix.platform }}
          path: deskfleet-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Web client
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

  android:
    if: ${{ !inputs.signed_ios }}
    name: Build (android-arm64)
    runs-on: ubuntu-26.04
    environment: ${{ inputs.production_release && 'production' || '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

      - name: Add Android SDK build-tools to PATH for apksigner
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "$build_tools" || ! -x "$build_tools/apksigner" ]]; then
            echo "::error::Could not locate apksigner under $sdk_root/build-tools"
            exit 1
          fi
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Generate temporary Android keystore for smoke builds
        id: smoke_keystore
        if: ${{ !inputs.production_release }}
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/deskfleet-android-smoke.jks"
          mise exec -- keytool -genkeypair -v \
            -keystore "$keystore_path" \
            -storetype PKCS12 \
            -alias deskfleet-smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass deskfleet-smoke \
            -keypass deskfleet-smoke \
            -dname "CN=DeskFleet CI, O=DeskFleet, C=US"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle and APK (smoke)
        if: ${{ !inputs.production_release }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.smoke_keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: deskfleet-smoke
          ANDROID_KEY_ALIAS: deskfleet-smoke
          ANDROID_KEY_PASSWORD: deskfleet-smoke
        run: mise run android:build

      - name: Prepare Android release keystore
        id: android_credentials
        if: ${{ inputs.production_release }}
        shell: bash
        env:
          DESKTOP_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$DESKTOP_SERVER_URL" ]]; then
            echo "::error::Set VITE_DESKFLEET_SERVER_URL in the production environment before publishing."
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/deskfleet-android-upload.jks"
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path")
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build production Android Web assets, App Bundle, and APK
        if: ${{ inputs.production_release }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_DIST: android
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ steps.android_credentials.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise run android:build

      - name: Remove Android keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/deskfleet-android-smoke.jks" "$RUNNER_TEMP/deskfleet-android-upload.jks"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-android
          path: apps/web/android/app/build/outputs/bundle/release/app-release-signed.aab
          if-no-files-found: error
          retention-days: 14

      # A separate artifact keeps the Google Play job's AAB path unchanged.
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-android-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build (ios-arm64)
    runs-on: macos-26
    environment: ${{ (inputs.production_release || inputs.signed_ios) && 'production' || '' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the pinned iOS toolchain
        run: xcodebuild -version

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}

      - name: Build iOS archive (smoke)
        if: ${{ !inputs.production_release && !inputs.signed_ios }}
        run: mise run ios:build

      - name: Prepare iOS release signing credentials
        id: ios_credentials
        if: ${{ inputs.production_release || inputs.signed_ios }}
        shell: bash
        env:
          DESKTOP_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$DESKTOP_SERVER_URL" ]]; then
            echo "::error::Set VITE_DESKFLEET_SERVER_URL in the production environment before publishing."
            exit 1
          fi
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done
          cert_path="$RUNNER_TEMP/deskfleet-ios-dist.p12"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/deskfleet-ios-signing.keychain-db"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          keychain_pass=$(LC_ALL=C head -c 32 /dev/urandom | base64)
          (umask 077 && printf '%s' "$IOS_DIST_CERT_P12" | base64 -d > "$cert_path")
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$key_path")
          security create-keychain -p "$keychain_pass" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_pass" "$keychain_path"
          security import "$cert_path" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

      - name: Download and validate iOS distribution profiles
        if: ${{ inputs.production_release || inputs.signed_ios }}
        env:
          IOS_SIGNING_KEYCHAIN: ${{ steps.ios_credentials.outputs.keychain_path }}
          IOS_APP_PROFILE_NAME: ${{ vars.IOS_APP_PROFILE_NAME }}
          IOS_BROADCAST_PROFILE_NAME: ${{ vars.IOS_BROADCAST_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ steps.ios_credentials.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: mise exec node -- node scripts/prepare-ios-signing.ts

      - name: Build production iOS Web assets and signed IPA
        if: ${{ inputs.production_release || inputs.signed_ios }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_DIST: ios
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
          DESKFLEET_IOS_SIGNED: "1"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: mise run ios:build

      - name: Remove iOS signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${{ steps.ios_credentials.outputs.keychain_path }}" ]]; then
            security delete-keychain "${{ steps.ios_credentials.outputs.keychain_path }}" || true
          fi
          rm -f "$RUNNER_TEMP/deskfleet-ios-dist.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          for profile_uuid in "$DESKFLEET_IOS_APP_PROFILE_UUID" "$DESKFLEET_IOS_BROADCAST_PROFILE_UUID"; do
            if [[ -n "$profile_uuid" ]]; then
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
            fi
          done

      - name: Upload iOS build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-ios-diagnostics
          path: apps/web/ios/App/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload iOS IPA
        if: ${{ inputs.production_release || inputs.signed_ios }}
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-ios
          path: |
            apps/web/ios/App/output/*.ipa
            apps/web/ios/App/output/release.json
          if-no-files-found: error
          retention-days: 14
