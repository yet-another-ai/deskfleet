name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'daily' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_build: ${{ steps.classify.outputs.run_build }}
      all_platforms: ${{ steps.classify.outputs.all_platforms }}
      run_backend: ${{ steps.classify.outputs.run_backend }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify documentation-only changes
        id: classify
        shell: bash
        run: |
          # Use the hosted runner's Node without provisioning a toolchain. Older
          # runtimes or missing output must fall back to full CI, never a skip.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "run_build=true" >> "$GITHUB_OUTPUT"
          echo "all_platforms=true" >> "$GITHUB_OUTPUT"
          echo "run_backend=true" >> "$GITHUB_OUTPUT"
          if ! node scripts/ci-docs-only.ts; then
            echo "::warning::Classification could not run; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "all_platforms=true" >> "$GITHUB_OUTPUT"
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test.yml
    with:
      docs_only: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
      draft_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
      all_platforms: ${{ needs.changes.result == 'success' && needs.changes.outputs.all_platforms == 'true' }}
      run_backend: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_backend == 'true' }}
    permissions:
      contents: read

  build:
    name: Build
    needs: [changes, test]
    # Stage packaging after a successful Test; failed or cancelled tests skip Build.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.test.result == 'success' && needs.changes.outputs.run_build == 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      smoke_build: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    permissions:
      contents: read

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [changes, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_BUILD: ${{ needs.changes.outputs.run_build }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          expected_build=success
          if [[ "$CHANGES_RESULT" == "success" && ("$DOCS_ONLY" == "true" || "$RUN_BUILD" == "false" || "$TEST_RESULT" != "success") ]]; then
            expected_build=skipped
          fi
          if [[ "$CHANGES_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "$expected_build" ]]; then
            echo "::error::CI did not pass (Changes: $CHANGES_RESULT, docs-only: $DOCS_ONLY, run-build: $RUN_BUILD, Test: $TEST_RESULT, Build: $BUILD_RESULT)."
            exit 1
          fi

  deploy-pages:
    name: Deploy website
    needs: [gate, test]
    # Documentation-only runs skip Build, so explicitly use Gate's result.
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
