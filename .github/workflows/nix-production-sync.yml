name: Sync Nix production configuration

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-production-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'yet-another-ai/deskfleet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the production configuration sync token
        env:
          SYNC_TOKEN: ${{ secrets.NIX_CONFIG_SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Configure the NIX_CONFIG_SYNC_TOKEN repository secret with Environments: read, Contents: write, and Pull requests: write permissions for this repository."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Install locked Node
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: --locked node

      # Read the five public variables through the API without granting main
      # access to the production environment's release-only signing secrets.
      - name: Generate the public production snapshot
        env:
          GH_TOKEN: ${{ secrets.NIX_CONFIG_SYNC_TOKEN }}
        run: mise exec node -- node scripts/nix-production.ts sync

      - name: Create or update the configuration pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.NIX_CONFIG_SYNC_TOKEN }}
          base: main
          branch: chore/nix-production-config
          delete-branch: true
          add-paths: nix/production.json
          commit-message: "chore(nix): synchronize production configuration"
          title: "chore(nix): synchronize production configuration"
          body: |
            ## Summary

            Refresh the five public API, Statsig, and Sentry build inputs from
            GitHub's production environment. Only `nix/production.json` changes.

            ## Verification

            Generated by `scripts/nix-production.ts sync` using its public-variable
            allowlist. The pull request's CI runs the Nix build and installed-package
            smoke checks. Review and merge this snapshot before tagging a release.
