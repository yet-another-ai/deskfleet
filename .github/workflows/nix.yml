name: Nix

on:
  workflow_call:
    inputs:
      pr_smoke_build:
        description: Verify Linux x64 only when called for a pull request.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Nix desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pr_smoke_build && github.event_name == 'pull_request' && '[{"platform":"linux-x64","os":"ubuntu-24.04"}]' || '[{"platform":"linux-x64","os":"ubuntu-24.04"},{"platform":"linux-arm64","os":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked Node for packaging and smoke checks
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: --locked node

      - name: Download the desktop application payload from Build
        uses: actions/download-artifact@v8
        with:
          name: deskfleet-desktop-${{ matrix.platform }}
          path: desktop-artifacts

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate the release flake and cache the application payload
        shell: bash
        run: |
          desktop_archives=("$GITHUB_WORKSPACE"/desktop-artifacts/*.tar.gz)
          mise exec node -- node scripts/package-nix-release.ts "$RUNNER_TEMP/deskfleet-nix.tar.gz" "${desktop_archives[@]}"
          tar -xzf "$RUNNER_TEMP/deskfleet-nix.tar.gz" -C "$RUNNER_TEMP"
          # The final release URL does not exist yet. Cache the exact same bytes
          # under the fetcher's name so the generated flake can be tested as-is.
          for archive in "${desktop_archives[@]}"; do
            nix store prefetch-file --name "$(basename "$archive")" "file://$archive"
          done

      - name: Check the generated flake
        run: nix flake check "$RUNNER_TEMP/deskfleet-nix" --print-build-logs

      - name: Build the desktop package
        run: nix build "$RUNNER_TEMP/deskfleet-nix#deskfleet" --print-build-logs

      - name: Enable Chromium's user namespace sandbox on the runner
        # Ubuntu's AppArmor restriction blocks unconfined Nix-store executables.
        # Keep the actual installed package and Chromium sandbox enabled.
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify the installed desktop and hosted daemon
        run: xvfb-run -a mise exec node -- node scripts/smoke-nix.ts ./result --gui
