name: Nix

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      production_release:
        description: Verify the public configuration against the production environment for a tag release.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Nix desktop (x86_64-linux)
    runs-on: ubuntu-24.04
    environment: ${{ inputs.production_release && 'production' || '' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked Node for configuration and package smoke checks
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install_args: --locked node

      - name: Verify the Nix production configuration
        if: ${{ inputs.production_release }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
        run: mise exec node -- node scripts/nix-production.ts check

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the flake
        run: nix flake check --print-build-logs

      - name: Build the desktop package
        run: nix build .#deskfleet --print-build-logs

      - name: Enable Chromium's user namespace sandbox on the runner
        # Ubuntu's AppArmor restriction blocks unconfined Nix-store executables.
        # Keep the actual installed package and Chromium sandbox enabled.
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify the installed desktop and hosted daemon
        run: xvfb-run -a mise exec node -- node scripts/smoke-nix.ts ./result --gui
