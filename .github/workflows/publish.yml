name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked Node
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.21
          install_args: --locked node

      - name: Validate tag against package versions
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: mise exec node -- node scripts/release-version.ts "$TAG_NAME"

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      sign_macos: true
    permissions:
      contents: read
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  release:
    name: Create draft GitHub release
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: deskfleet-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Download server and daemon archives
        uses: actions/download-artifact@v8
        with:
          pattern: deskfleet-{linux-x64,linux-arm64,macos-arm64,windows-x64}
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          assets=(
            "deskfleet-$VERSION-mac-arm64.dmg"
            "deskfleet-$VERSION-mac-arm64.zip"
            "deskfleet-$VERSION-win-x64.exe"
            "deskfleet-$VERSION-linux-x64.AppImage"
            "deskfleet-$VERSION-linux-arm64.AppImage"
            deskfleet-linux-x64.tar.gz
            deskfleet-linux-arm64.tar.gz
            deskfleet-macos-arm64.tar.gz
            deskfleet-windows-x64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -f "release-assets/$asset"
          done
          test "$(find release-assets -mindepth 1 -maxdepth 1 | wc -l)" -eq "${#assets[@]}"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $TAG_NAME is already published."
              exit 1
            fi
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            args=(--verify-tag --generate-notes --title "DeskFleet $TAG_NAME" --draft)
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$TAG_NAME" release-assets/* "${args[@]}"
          fi

  image:
    name: Publish backend image
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Linux server archives
        uses: actions/download-artifact@v8
        with:
          pattern: deskfleet-linux-*
          path: archives
          merge-multiple: true

      - name: Stage native server binaries
        shell: bash
        run: |
          mkdir -p image-context/amd64 image-context/arm64
          tar -xzf archives/deskfleet-linux-x64.tar.gz -C image-context/amd64 ./deskfleet-server
          tar -xzf archives/deskfleet-linux-arm64.tar.gz -C image-context/arm64 ./deskfleet-server

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-server
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' }}

      - name: Publish both Linux architectures
        uses: docker/build-push-action@v7
        with:
          context: image-context
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
