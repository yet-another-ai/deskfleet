name: Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      docs_only:
        description: Keep static checks and skip runtime tests for classified documentation changes.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CI-only compilation tuning. Local builds keep full debug info. CI only
  # needs line tables for backtraces, and MSVC PDB generation is a large part
  # of Windows build time. Incremental compilation is disabled so sccache can
  # cache every rustc invocation.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"

      - name: Run static checks
        run: mise run ci:check:static

      - name: Upload the product website for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Report shared compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache

  checks:
    name: Tests (${{ matrix.name }})
    if: >-
      ${{ !(inputs.docs_only &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"

      - name: Run tests
        run: mise run test

      - name: Report shared compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache

  backend:
    name: PostgreSQL and remote backend
    if: >-
      ${{ !(inputs.docs_only &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: deskfleet_test
          POSTGRES_PASSWORD: deskfleet_test
          POSTGRES_DB: deskfleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deskfleet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.3@sha256:0c257ce8b2f31f9f7595f587edf8ac259a248ba3ced82badc8c7aa826a85224f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deskfleet_test:deskfleet_test@127.0.0.1:5432/deskfleet_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate development Compose configuration
        run: docker compose config --quiet

      - name: Set up build environment
        id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"

      - name: Run PostgreSQL and Redis integration tests
        run: mise run backend:test

      - name: Run authenticated remote workflow
        run: mise run backend:smoke

      - name: Configure Electron sandbox
        run: |
          mise exec -- pnpm --filter @deskfleet/desktop exec install-electron
          electron_sandbox=$(mise exec -- pnpm --filter @deskfleet/desktop exec node -p 'require.resolve("electron/dist/chrome-sandbox")')
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"

      - name: Save Electron downloads
        if: >-
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          steps.setup_build.outputs.electron-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup_build.outputs.electron-path }}
          key: ${{ steps.setup_build.outputs.electron-cache-key }}

      - name: Run the built Web and Electron clients
        run: xvfb-run -a mise run backend:smoke-clients

      - name: Start the test TURN relay
        run: >-
          docker run --detach --name deskfleet-turn-test
          -p 127.0.0.1:3478:3478/udp -p 127.0.0.1:3478:3478/tcp
          -p 127.0.0.1:49160-49180:49160-49180/udp
          coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
          --no-cli --no-tls --fingerprint --use-auth-secret
          --static-auth-secret=deskfleet-test-relay-secret --realm=deskfleet.test
          --listening-port=3478 --min-port=49160 --max-port=49180
          --external-ip=127.0.0.1 --allow-loopback-peers --log-file=stdout

      - name: Verify the remote workflow over TURN only
        env:
          DESKFLEET_TURN_URLS: turn:127.0.0.1:3478?transport=udp
          DESKFLEET_TURN_SECRET: deskfleet-test-relay-secret
          DESKFLEET_SMOKE_RELAY_ONLY: "1"
        run: mise run backend:smoke

      - name: Verify Web and Electron over TURN only
        env:
          DESKFLEET_TURN_URLS: turn:127.0.0.1:3478?transport=udp
          DESKFLEET_TURN_SECRET: deskfleet-test-relay-secret
          DESKFLEET_SMOKE_FORCE_RELAY: "1"
        run: xvfb-run -a mise run backend:smoke-clients

      - name: Stop the test relay
        if: ${{ always() }}
        run: docker rm --force deskfleet-turn-test || true

      - name: Report shared compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache
