[workspace]
members = [
    "apps/server",
    "crates/control-store",
    "crates/capture",
    "crates/encoder",
    "crates/input",
    "crates/linux-media",
    "crates/model",
    "crates/migration",
    "crates/native",
    "crates/nvenc",
    "crates/nvenc-sys",
    "crates/node",
    "crates/protocol",
    "crates/store",
    "crates/wayland",
]
exclude = [".agents/skills/rust-skills/checks"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/yet-another-ai/deskfleet"
publish = false

[workspace.dependencies]
deskfleet-capture = { path = "crates/capture" }
deskfleet-encoder = { path = "crates/encoder" }
deskfleet-input = { path = "crates/input" }
deskfleet-linux-media = { path = "crates/linux-media" }
deskfleet-wayland = { path = "crates/wayland" }
deskfleet-nvenc = { path = "crates/nvenc" }
deskfleet-nvenc-sys = { path = "crates/nvenc-sys" }
deskfleet-model = { path = "crates/model" }
deskfleet-migration = { path = "crates/migration" }
deskfleet-store = { path = "crates/store" }
deskfleet-control-store = { path = "crates/control-store" }
deskfleet-native = { path = "crates/native" }
deskfleet-protocol = { path = "crates/protocol" }

actix-web = { version = "4.17", default-features = false, features = ["macros"] }
async-trait = "0.1"
bytes = "1"
napi = { version = "3.15", default-features = false, features = ["napi8", "dyn-symbols", "tokio_rt"] }
napi-build = "2.6"
napi-derive = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }
rand = "0.10"
opus = "0.4"
portable-pty = "0.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
socket2 = "0.6.5"
filedescriptor = "0.8"
nix = { version = "0.31", features = ["signal"] }
libloading = "0.9"

block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
