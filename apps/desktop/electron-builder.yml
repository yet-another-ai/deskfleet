appId: io.github.yet-another-ai.deskfleet
# Keep package.json's runtime name stable for Electron profiles and safeStorage.
productName: DeskFleet
executableName: deskfleet
asar: true
asarUnpack:
  - out/main/deskfleet.node
extraResources:
  - from: out/dsh
    to: dsh
  # Resource matchers skip their root node_modules directory; copy it explicitly.
  - from: out/dsh/node_modules
    to: dsh/node_modules
# Vite bundles every renderer and main-process dependency into out/.
npmRebuild: false
# Give packaged executables their own macOS Local Network permission identity.
afterPack: ./scripts/mac-build-uuid.ts
# Fuses and ASAR integrity harden loading but do not replace platform code signing.
electronFuses:
  # Flipping fuses changes executable pages. Unsigned Apple Silicon builds need
  # a fresh ad-hoc signature or macOS terminates them with CODESIGNING/Invalid Page.
  resetAdHocDarwinSignature: true
  # The bundled ACP adapters use Electron as their Node host.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

directories:
  output: release

artifactName: "deskfleet-${version}-${os}-${arch}.${ext}"

# Generate updater metadata without publishing from individual build jobs.
# GitHub's published/prerelease status selects releases; each release owns its feed.
publish:
  provider: github
  owner: yet-another-ai
  repo: deskfleet
  channel: latest

files:
  - out/**/*
  - "!out/**/*.map"
  - "!out/dsh/**/*"
  - "!out/auv/**/*"
  - "!out/windows/**/*"
  - "!out/native/**/*"
  # Runtime window and tray images; build/ is otherwise packaging input only.
  - build/icon.png
  - build/tray*.png
  - package.json

mac:
  # Safari's HTTPS-Only mode blocks HTTP loopback, so packaged macOS sign-in
  # returns through the scheme shared with the mobile apps. Restrict this to
  # mac: Windows and Linux do not handle callback URLs from second-instance.
  protocols:
    - name: DeskFleet
      schemes:
        - ai.yetanother.deskfleet
  # Apple's 824-on-1024 grid; full-bleed icon.png looks oversized in Dock/Finder (#652).
  icon: build/icon-mac.png
  extraResources:
    - from: out/auv/auv
      to: ../MacOS/auv
    - from: out/native/deskfleet-viewer
      to: native/deskfleet-viewer
  binaries:
    - Contents/MacOS/auv
    - Contents/Resources/native/deskfleet-viewer
  category: public.app-category.developer-tools
  hardenedRuntime: true
  extendInfo:
    NSMicrophoneUsageDescription: DeskFleet uses your microphone to dictate messages.
    NSSpeechRecognitionUsageDescription: DeskFleet uses system speech recognition to transcribe dictated messages.
    NSLocalNetworkUsageDescription: DeskFleet connects to your other machines for terminals, agent sessions, files, and remote desktops.
  target:
    - dmg
    - zip

win:
  # Keep the full-bleed master for Windows; do not inherit mac.icon.
  icon: build/icon.png
  extraResources:
    - from: out/auv/auv.exe
      to: bin/auv.exe
    - from: out/native/deskfleet-viewer.exe
      to: native/deskfleet-viewer.exe
    - from: out/windows
      to: windows
  target:
    - nsis

nsis:
  # Keep the application's existing per-user install; only the optional service
  # requests administrator privileges through its own fixed setup commands.
  perMachine: false
  include: build/windows-desktop-service.nsh

linux:
  # electron-builder's LinuxTargetHelper falls back to mac.icon when linux.icon is
  # unset; pin the full-bleed master so AppImage/tar.gz stay optically unchanged.
  icon: build/icon.png
  extraResources:
    - from: out/auv
      to: bin
    - from: out/native/deskfleet-viewer
      to: native/deskfleet-viewer
  category: Development
  # Match the stable Portal identity used by Electron and standalone daemons.
  syncDesktopName: true
  target:
    - AppImage
    # Reusable application payload for Nix and other Linux package formats.
    - tar.gz
