appId: io.github.yet-another-ai.deskfleet
# Keep package.json's runtime name stable for Electron profiles and safeStorage.
productName: DeskFleet
executableName: deskfleet
asar: true
asarUnpack:
  - out/main/deskfleet.node
# Vite bundles every renderer and main-process dependency into out/.
npmRebuild: false
# Give packaged executables their own macOS Local Network permission identity.
afterPack: ./scripts/mac-build-uuid.ts
# Fuses and ASAR integrity harden loading but do not replace platform code signing.
electronFuses:
  # Flipping fuses changes executable pages. Unsigned Apple Silicon builds need
  # a fresh ad-hoc signature or macOS terminates them with CODESIGNING/Invalid Page.
  resetAdHocDarwinSignature: true
  # The bundled ACP adapters use Electron as their Node host.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

directories:
  output: release

artifactName: "deskfleet-${version}-${os}-${arch}.${ext}"

# Generate updater metadata without publishing from individual build jobs.
# GitHub's published/prerelease status selects releases; each release owns its feed.
publish:
  provider: github
  owner: yet-another-ai
  repo: deskfleet
  channel: latest

files:
  - out/**/*
  - "!out/**/*.map"
  # Runtime window and tray images; build/ is otherwise packaging input only.
  - build/icon.png
  - build/tray*.png
  - package.json

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  extendInfo:
    NSLocalNetworkUsageDescription: DeskFleet connects to your other machines for terminals, agent sessions, files, and remote desktops.
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  category: Development
  # Match the stable Portal identity used by Electron and standalone daemons.
  syncDesktopName: true
  target:
    - AppImage
