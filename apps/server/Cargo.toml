[package]
name = "deskfleet-server"
description = "The DeskFleet control-plane HTTP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
actix-web = { workspace = true, features = ["cookies"] }
deskfleet-protocol.workspace = true
deskfleet-control-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
actix-ws = "0.4.0"
actix-cors = "0.7"
actix-files = "0.7.2"
futures-util = "0.3"
redis = { version = "1.8.0", default-features = false, features = ["tokio-rustls-comp"] }
argon2 = { version = "0.5", features = ["std"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# WebAuthn uses OpenSSL; build its crypto library without a host installation.
openssl = { version = "0.10", features = ["vendored"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
base64 = "0.23.1"
url = "2"
sdp = { package = "rtc-sdp", version = "0.21.1" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
serde_json.workspace = true
sea-orm.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["openssl"]
