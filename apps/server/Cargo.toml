[package]
name = "deskfleet-server"
description = "The deskfleet control-plane HTTP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
actix-web.workspace = true
deskfleet-protocol.workspace = true
deskfleet-control-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
actix-ws = "0.4.0"
actix-cors = "0.7"
futures-util = "0.3"
redis = { version = "1.8.0", default-features = false, features = ["tokio-rustls-comp"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# openidconnect implements AsyncHttpClient for reqwest 0.12.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = "0.23.1"
url = "2"
sdp = { package = "rtc-sdp", version = "0.21.1" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
sea-orm.workspace = true

[lints]
workspace = true
