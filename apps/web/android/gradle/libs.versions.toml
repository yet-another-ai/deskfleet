[versions]
agp = "9.5.1"
# AGP 9 embeds Kotlin 2.2; Firebase Analytics 24 ships Kotlin 2.4 metadata.
# Keep this in sync with the buildscript classpath override in build.gradle.kts.
kotlin = "2.4.21"
compileSdk = "37"
minSdk = "34"
targetSdk = "37"
ndk = "28.2.13676358"
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxCoordinatorlayout = "1.3.0"
androidxCore = "1.19.1"
androidxCoreSplashscreen = "1.2.0"
androidxFragment = "1.9.1"
androidxWebkit = "1.18.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxEspressoCore = "3.7.0"
googleServices = "4.6.0"
firebaseAnalytics = "24.0.0"

[libraries]
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "androidxCoordinatorlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "firebaseAnalytics" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
