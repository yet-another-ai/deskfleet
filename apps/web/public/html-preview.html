<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      window.addEventListener(
        "message",
        event => {
          if (event.source !== window.parent || typeof event.data?.html !== "string") return
          const blob = new Blob([event.data.html], { type: "text/html;charset=utf-8" })
          location.replace(URL.createObjectURL(blob))
        },
        { once: true },
      )
    </script>
  </head>
  <body></body>
</html>
