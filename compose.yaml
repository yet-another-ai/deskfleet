# Local development only. Applications run on the host through mise.
# All published ports and the TURN relay address are loopback-only.
name: deskfleet-dev

services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: deskfleet
      POSTGRES_PASSWORD: deskfleet-dev
      POSTGRES_DB: deskfleet
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA in /var/lib/postgresql/18/docker.
      # A new volume initializes disposable dev data without touching the old one.
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "deskfleet", "-d", "deskfleet"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Test fixtures never share the development database. Stopping this service
  # discards its data; no development volume is involved in a test reset.
  postgres-test:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: deskfleet_test
      POSTGRES_PASSWORD: deskfleet-test
      POSTGRES_DB: deskfleet_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "deskfleet_test", "-d", "deskfleet_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  turn:
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    depends_on:
      valkey:
        condition: service_healthy
    tmpfs:
      - /var/lib/coturn
    command:
      - --no-cli
      - --no-tls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=deskfleet-dev-relay-secret
      - --realm=deskfleet.local
      - --redis-statsdb=ip=valkey dbname=0 connect_timeout=5
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49180
      - --external-ip=127.0.0.1
      - --allow-loopback-peers
      - --log-file=stdout
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49180:49160-49180/udp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-18-data:
