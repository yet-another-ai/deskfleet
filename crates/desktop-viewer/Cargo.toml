[package]
name = "deskfleet-desktop-viewer"
description = "Native remote desktop window with shallow FIFO presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "deskfleet-viewer"
path = "src/main.rs"

[dependencies]
deskfleet-native.workspace = true
deskfleet-input.workspace = true
bytes.workspace = true
rtc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "30.0.1"
pollster = "1.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30.13"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk = { version = "0.9.0", features = ["media", "nativewindow", "api-level-26"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = [
    "CFNumber", "CFString", "CFDictionary", "CFData",
] }
objc2-core-media = { workspace = true, features = [
    "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime",
] }
objc2-core-video = { workspace = true, features = [
    "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }
objc2-video-toolbox = { workspace = true, features = [
    "VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "VTSession",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-video-toolbox = { workspace = true, features = [
    "VTCompressionSession", "VTCompressionProperties",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
deskfleet-linux-media.workspace = true
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
nix = { workspace = true, features = ["poll"] }

[lints]
workspace = true

