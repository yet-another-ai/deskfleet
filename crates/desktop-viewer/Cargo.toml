[package]
name = "deskfleet-desktop-viewer"
description = "Native remote desktop viewer with NSH/GPUI desktop controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "deskfleet-viewer"
path = "src/main.rs"

[dependencies]
deskfleet-native.workspace = true
deskfleet-input.workspace = true
bytes.workspace = true
rtc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gpui = { package = "gpui-fast", version = "=0.1.15", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.15", default-features = false, features = ["font-kit", "wayland", "x11"] }
nsh-core = "=0.5.0"
nsh-base = { version = "=0.5.0", default-features = false }
nsh-platform-gpui = { version = "=0.5.0", default-features = false }
async-channel = "2"
image = { version = "0.25", default-features = false }
raw-window-handle = { version = "0.6", features = ["std"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
wgpu = "30.0.1"
pollster = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk = { version = "0.9.0", features = ["media", "nativewindow", "api-level-33"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { workspace = true, features = [
    "CFNumber", "CFString", "CFDictionary", "CFData",
] }
objc2-core-media = { workspace = true, features = [
    "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime",
] }
objc2-core-video = { workspace = true, features = [
    "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }
objc2-video-toolbox = { workspace = true, features = [
    "VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "VTSession",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSView", "NSWindow", "NSResponder", "block2"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-video-toolbox = { workspace = true, features = [
    "VTCompressionSession", "VTCompressionProperties",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
deskfleet-linux-media.workspace = true
nix = { workspace = true, features = ["poll"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
x11rb.workspace = true
xkbcommon = "0.9"

[lints]
workspace = true

