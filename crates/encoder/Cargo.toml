[package]
name = "deskfleet-encoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Hardware video encoding abstraction with platform-specific backends"

[lints]
workspace = true

[dependencies]
deskfleet-capture = { workspace = true }
tracing = { workspace = true }
# opus 0.4 bundles and statically links libopus through opusic-sys.
opus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = [
    "CFNumber",
    "CFString",
    "CFDictionary",
] }
objc2-core-media = { workspace = true, features = [
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMFormatDescriptionBridge",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-core-video = { workspace = true, features = [
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferIOSurface",
    "CVReturn",
    "objc2-io-surface",
] }
objc2-io-surface = { workspace = true, features = [
    "IOSurfaceRef",
] }
objc2-video-toolbox = { workspace = true, features = [
    "VTCompressionProperties",
    "VTCompressionSession",
    "VTErrors",
    "VTSession",
] }

[target.'cfg(target_os = "windows")'.dependencies]
deskfleet-nvenc = { workspace = true }
deskfleet-nvenc-sys = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
