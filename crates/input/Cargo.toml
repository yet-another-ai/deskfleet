[package]
name = "deskfleet-input"
description = "Display-scoped remote mouse and keyboard input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
deskfleet-linux-desktop.workspace = true
deskfleet-x11.workspace = true
deskfleet-wayland.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
