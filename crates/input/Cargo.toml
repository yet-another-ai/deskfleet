[package]
name = "deskfleet-input"
description = "Display-scoped remote mouse and keyboard input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
deskfleet-windows-desktop.workspace = true
windows = { workspace = true, features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, features = ["NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
deskfleet-linux-desktop.workspace = true
deskfleet-x11.workspace = true
deskfleet-wayland.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
