[package]
name = "deskfleet-native"
description = "Native platform capabilities for the DeskFleet daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deskfleet-capture.workspace = true
deskfleet-encoder.workspace = true
deskfleet-input.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
webrtc.workspace = true
rtc.workspace = true
rand.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
filedescriptor.workspace = true
nix = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
deskfleet-windows-desktop.workspace = true
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Media_Speech", "Win32_Media_Audio", "Win32_Globalization", "Networking_Connectivity", "Win32_System_WinRT"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
starship-battery.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
deskfleet-linux-desktop.workspace = true
deskfleet-wayland.workspace = true
deskfleet-gstreamer-media.workspace = true
deskfleet-x11.workspace = true
zbus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
