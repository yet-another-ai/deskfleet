[package]
name = "deskfleet-windows-desktop"
description = "Windows desktop service, authenticated local transport, and session binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
rand.workspace = true
windows = { workspace = true, features = [
    "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory",
    "Win32_System_Services", "Win32_System_Threading", "Win32_System_Pipes",
    "Win32_System_RemoteDesktop", "Win32_System_JobObjects",
    "Win32_System_Environment", "Win32_System_Com", "Win32_System_Registry",
    "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell", "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
