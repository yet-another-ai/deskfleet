[workspace]
members = [".", "nix-shim"]
resolver = "2"

[package]
name = "deskfleet_kmp_bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "deskfleet_kmp_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1.11"
jni = "0.22.4"
openh264 = "0.9"
rand = "0.9"
rtc = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
webrtc = "0.21.1"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["net"] }

[patch.crates-io]
nix = { path = "nix-shim" }
