min_version = "2026.10.2"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
apm = "0.35.0"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"] }
node = "24.22.1"
pnpm = "12.15.0"
"cargo:cargo-shear" = "1.14.0"
cmake = "4.4.4"

[env]
# Missing platform files are skipped; macOS uses the Apple native toolchain.
_.file = ".config/build-env/{{ os() }}.toml"

[tasks.install]
description = "Install the locked TypeScript workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."skills:install"]
description = "Restore the pinned, repository-local agent skills"
run = "apm install --frozen"

[tasks.dev]
description = "Run the Actix Web backend"
run = "cargo run -p deskfleet-server --locked"

[tasks."infra:up"]
description = "Start local PostgreSQL, test PostgreSQL, OIDC, and TURN; wait for readiness"
run = "docker compose up --detach --wait --wait-timeout 120"

[tasks."infra:down"]
description = "Stop local infrastructure, preserving development database and OIDC volumes"
run = "docker compose down"

[tasks."backend:build"]
description = "Build the API-only central backend"
wait_for = ["native:debug", "rust:clippy", "rust:test"]
run = "cargo build -p deskfleet-server --locked"

[tasks."backend:test"]
description = "Run central persistence and API integration tests against TEST_DATABASE_URL (PostgreSQL)"
run = "cargo test -p deskfleet-control-store -p deskfleet-server --locked -- --ignored"

[tasks."backend:smoke"]
description = "Verify OIDC, two authenticated daemons, WebRTC, and synchronized history against PostgreSQL"
depends = ["native:debug", "backend:build"]
run = "node scripts/smoke-backend.ts"

[tasks."backend:smoke-clients"]
description = "Verify built Web and Electron clients against real OIDC, PostgreSQL, and remote daemons"
depends = ["backend:build", "desktop:build", "web:build"]
run = "node apps/desktop/scripts/smoke-backend-clients.ts"

[tasks."backend:smoke-relay"]
description = "Force native, Web, and Electron backend smoke tests through the configured TURN relay"
env.DESKFLEET_SMOKE_RELAY_ONLY = "1"
env.DESKFLEET_SMOKE_FORCE_RELAY = "1"
run = ["mise run backend:smoke", "mise run backend:smoke-clients"]

[tasks."protocol:generate"]
description = "Regenerate shared TypeScript control contracts from Rust"
run = "cargo run -p deskfleet-protocol --example export_types --locked"

[tasks."db:migrate"]
description = "Run catalog migrations (up by default; accepts status/down arguments)"
env.DATABASE_URL = "{{ env.DATABASE_URL | default(value='sqlite://deskfleet.db?mode=rwc') }}"
run = "cargo run -p deskfleet-migration --features cli --locked --"

[tasks.check]
description = "Run TypeScript and Rust checks, tests, and debug builds"
depends = ["check:static", "test", "rust:build", "desktop:build", "web:build"]

[tasks."check-fast"]
description = "Run the Rust edit-loop checks"
depends = ["rust:format:check", "rust:shear", "rust:clippy", "rust:test"]

[tasks.format]
description = "Format the Rust workspace"
depends = ["rust:format"]

[tasks."format-check"]
description = "Check Rust formatting"
depends = ["rust:format:check"]

[tasks.lint]
description = "Check Rust dependencies and Clippy diagnostics"
depends = ["rust:shear", "rust:clippy"]

[tasks.test]
description = "Run script, daemon, desktop, and Rust tests"
depends = ["check:scripts", "check:daemon", "check:desktop", "check:rust-tests"]

[tasks.build]
description = "Build the release server and standalone daemon"
depends = ["rust:release", "daemon:pack", "web:build"]

[tasks."rust:release"]
hide = true
wait_for = ["native:release"]
run = "cargo build --workspace --release --locked"

[tasks."native:debug"]
hide = true
depends = ["install"]
run = "pnpm --filter @deskfleet/native build:debug"

[tasks."native:release"]
hide = true
depends = ["install"]
run = "pnpm --filter @deskfleet/native build"

[tasks."daemon:dev"]
description = "Run the standalone headless daemon from TypeScript"
depends = ["native:debug"]
run = "node apps/daemon/src/main.ts"

[tasks."daemon:pack"]
description = "Package the daemon as a Node.js single executable"
depends = ["native:release"]
run = "node scripts/build-sea.ts"

[tasks."daemon:smoke"]
description = "Verify an isolated SEA executable without an installed Node.js"
run = "node scripts/smoke-daemon.ts"

[tasks."files:benchmark"]
description = "Measure native WebRTC file upload/download throughput with SHA-256 verification"
depends = ["native:debug"]
run = "node scripts/benchmark-files.ts"

[tasks."desktop:dev"]
description = "Run the Electron desktop app with Vite watchers"
depends = ["native:debug"]
run = "pnpm --filter @deskfleet/desktop dev"

[tasks."web:dev"]
description = "Run the independently hosted Vue Web client"
depends = ["install"]
run = "pnpm --filter @deskfleet/web dev"

[tasks."web:build"]
description = "Build the independent Vue Web client"
depends = ["install"]
run = "pnpm --filter @deskfleet/web build"

[tasks."web:typecheck"]
description = "Check the Web client and shared Vue components"
depends = ["install"]
run = "pnpm --filter @deskfleet/web typecheck"

[tasks."desktop:smoke-media"]
description = "Verify Chromium decoding native WebRTC media without screen capture"
depends = ["install"]
run = ["cargo build -p deskfleet-native --example media_smoke --locked", "node apps/desktop/scripts/smoke-media.ts"]

[tasks."desktop:build"]
description = "Build the Electron main, preload, and renderer bundles"
depends = ["native:debug"]
run = "pnpm --filter @deskfleet/desktop build"

[tasks."desktop:smoke-terminal"]
description = "Verify Chromium terminal I/O and PTY reattachment over WebRTC"
depends = ["native:debug"]
run = "node apps/desktop/scripts/smoke-terminal.ts"

[tasks."desktop:smoke-catalog"]
description = "Verify local catalog forms, persistence, and directory terminals in Electron"
depends = ["native:debug", "desktop:build"]
run = "node apps/desktop/scripts/smoke-catalog.ts"

[tasks."desktop:smoke-agent"]
description = "Verify Agent conversations, backlog, steering, permissions, and durable replay in Electron"
depends = ["native:debug", "desktop:build"]
run = "node apps/desktop/scripts/smoke-agent.ts"

[tasks."desktop:smoke-startup"]
description = "Verify the actual Electron package entry and bundled ACP adapter startup"
depends = ["desktop:build"]
run = "node apps/desktop/scripts/smoke-startup.ts"

[tasks."desktop:smoke-local-agent"]
description = "Verify Settings startup, shutdown, and the hosted local Agent lifetime in Electron"
depends = ["native:debug", "desktop:build"]
run = "node apps/desktop/scripts/smoke-local-agent.ts"

[tasks."desktop:package"]
description = "Package the desktop app as installers for the host platform"
depends = ["desktop:release-build"]
run = "pnpm --filter @deskfleet/desktop run package"

[tasks."desktop:package:dir"]
description = "Package the desktop app as an unpacked directory for the host platform"
depends = ["desktop:release-build"]
run = "pnpm --filter @deskfleet/desktop run package:dir"

[tasks."desktop:release-build"]
hide = true
depends = ["native:release"]
run = "pnpm --filter @deskfleet/desktop build"

[tasks."rust:format"]
hide = true
run = "cargo fmt --all"

[tasks."rust:format:check"]
hide = true
run = "cargo fmt --all -- --check"

[tasks."rust:shear"]
hide = true
run = "cargo shear --locked"

[tasks."rust:clippy"]
hide = true
wait_for = ["native:debug"]
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."rust:test"]
hide = true
# Serialize Cargo tasks sharing target/ only when both are scheduled.
wait_for = ["native:debug", "rust:clippy"]
run = "cargo test --workspace --locked"

[tasks."rust:build"]
hide = true
wait_for = ["native:debug", "rust:clippy", "rust:test"]
run = "cargo build --workspace --locked"

[tasks."check:rust-skills-harness"]
hide = true
run = "node scripts/check-rust-skills-harness.ts"

[tasks."check:static"]
hide = true
depends = ["check:rust-skills-harness", "check:types", "check:desktop-types", "web:typecheck", "rust:format:check", "rust:shear", "rust:clippy"]

[tasks."check:types"]
hide = true
depends = ["native:debug"]
run = "pnpm typecheck"

[tasks."check:desktop-types"]
hide = true
depends = ["native:debug"]
run = "pnpm --filter @deskfleet/desktop typecheck"

[tasks."check:daemon"]
hide = true
depends = ["native:debug"]
# Both suites create many SQLite catalogs; avoid competing for runner storage.
wait_for = ["rust:test"]
run = "node --test apps/daemon/src/*.test.ts"

[tasks."check:desktop"]
hide = true
depends = ["install"]
run = "pnpm --filter @deskfleet/desktop test"

[tasks."check:scripts"]
hide = true
depends = ["install"]
run = "node --test scripts/*.test.ts"

[tasks."check:rust-tests"]
hide = true
depends = ["rust:test"]

[tasks."ci:check:static"]
hide = true
depends = ["check:static", "check:scripts", "desktop:build", "web:build"]

[tasks."ci:report:sccache"]
hide = true
run = "node scripts/ci-report-sccache.ts"
