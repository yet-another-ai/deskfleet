min_version = "2026.11.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[settings.npm]
package_manager = "pnpm"

[tools]
apm = "0.35.0"
java = "temurin-21.0.13+9.0.LTS"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["aarch64-linux-android"] }
node = "24.22.1"
bun = "1.4.5"
pnpm = "12.15.0"
"npm:@informalsystems/quint" = "0.33.1"
"cargo:cargo-shear" = "1.14.0"
cmake = "4.4.4"

[env]
# Missing platform files are skipped; macOS uses the Apple native toolchain.
_.file = ".config/build-env/{{ os() }}.toml"

[tasks.install]
description = "Install the locked TypeScript workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."skills:install"]
description = "Restore the pinned, repository-local agent skills"
run = "apm install --frozen"

[tasks.dev]
description = "Run the central API and Web client, including desktop login pages"
depends = ["backend:dev", "web:dev"]

[tasks."backend:dev"]
description = "Run the Actix Web backend"
run = "cargo run -p deskfleet-server --locked"

[tasks."dev:seed"]
description = "Create a verified Site Admin in the local development database"
env.DATABASE_URL = "postgres://deskfleet:deskfleet-dev@127.0.0.1:55432/deskfleet"
run = "cargo run -p deskfleet-server --locked -- dev-seed"

[tasks."infra:up"]
description = "Start local PostgreSQL, test PostgreSQL, Valkey, and TURN; wait for readiness"
run = "docker compose up --detach --wait --wait-timeout 120"

[tasks."infra:down"]
description = "Stop local infrastructure, preserving development database volumes"
run = "docker compose down"

[tasks."backend:build"]
description = "Build the central server"
wait_for = ["native:debug", "rust:clippy", "rust:test"]
run = "cargo build -p deskfleet-server --locked"

[tasks."backend:image:nix"]
description = "Build the experimental Linux server and Web image from source with Nix"
run = "nix build .#server-image --print-build-logs --out-link result-server-image"

[tasks."backend:test"]
description = "Run persistence, API, and TURN collection tests against TEST_DATABASE_URL and TEST_REDIS_URL"
run = "cargo test -p deskfleet-control-store -p deskfleet-server --locked -- --ignored"

[tasks."backend:smoke"]
description = "Verify owned login, two authenticated daemons, WebRTC, and synchronized history against PostgreSQL"
depends = ["native:debug", "backend:build"]
run = "node scripts/smoke-backend.ts"

[tasks."backend:smoke-clients"]
description = "Verify built Web and Electron clients against owned login, PostgreSQL, and remote daemons"
depends = ["backend:build", "desktop:build", "web:build"]
run = "node apps/desktop/scripts/smoke-backend-clients.ts"

[tasks."backend:smoke-relay"]
description = "Force native, Web, and Electron backend smoke tests through the configured TURN relay"
env.DESKFLEET_SMOKE_RELAY_ONLY = "1"
env.DESKFLEET_SMOKE_FORCE_RELAY = "1"
run = ["mise run backend:smoke", "mise run backend:smoke-clients"]

[tasks."protocol:generate"]
description = "Regenerate shared TypeScript control contracts from Rust"
run = "cargo run -p deskfleet-protocol --example export_types --locked"

[tasks."db:migrate"]
description = "Run catalog migrations (up by default; accepts status/down arguments)"
env.DATABASE_URL = "{{ env.DATABASE_URL | default(value='sqlite://deskfleet.db?mode=rwc') }}"
run = "cargo run -p deskfleet-migration --features cli --locked --"

[tasks.check]
description = "Run TypeScript and Rust checks, tests, and debug builds"
depends = ["check:static", "test", "rust:build", "desktop:build", "web:build", "docs:build"]

[tasks."check-fast"]
description = "Run the Rust edit-loop checks"
depends = ["rust:format:check", "rust:shear", "rust:clippy", "rust:test"]

[tasks.format]
description = "Format the Rust workspace"
depends = ["rust:format"]

[tasks."format-check"]
description = "Check Rust formatting"
depends = ["rust:format:check"]

[tasks.lint]
description = "Check Rust dependencies and Clippy diagnostics"
depends = ["rust:shear", "rust:clippy"]

[tasks.test]
description = "Run script, daemon, desktop, and Rust tests"
depends = ["check:scripts", "check:daemon", "check:desktop", "check:rust-tests"]

[tasks."ci:test:platform"]
description = "Run platform tests; the shared renderer suite runs on Linux CI"
depends = ["check:scripts", "check:daemon", "ci:check:desktop-main", "check:rust-tests"]

[tasks.build]
description = "Build the release server and standalone daemon"
depends = ["rust:release", "web:build"]
run = "node scripts/build-daemon.ts"

[tasks."build:macos-x64"]
description = "Cross-compile the Intel macOS server and standalone daemon on Apple Silicon"
depends = ["install"]
run = [
  'test "$(uname -sm)" = "Darwin arm64"',
  "rustup target add x86_64-apple-darwin",
  "cargo build --release --locked --target x86_64-apple-darwin --target-dir target -p deskfleet-node -p deskfleet-server",
  "mkdir -p apps/daemon/dist/macos-x64",
  "cp target/x86_64-apple-darwin/release/libdeskfleet_node.dylib apps/daemon/dist/macos-x64/deskfleet.node",
  "node scripts/build-daemon.ts macos-x64",
]

[tasks."rust:release"]
hide = true
depends = ["install"]
# napi selects the host target and emits the addon/bindings after Cargo finishes.
# Build the server in that same invocation instead of a second target tree.
run = "pnpm --filter @deskfleet/native exec napi build --release --no-js --no-const-enum --dts bindings.d.ts -- --workspace --locked"

[tasks."ci:build"]
hide = true
depends = ["build", "ci:desktop-build"]

[tasks."ci:desktop-build"]
hide = true
depends = ["rust:release"]
run = "pnpm --filter @deskfleet/desktop build"

[tasks."native:debug"]
hide = true
depends = ["install"]
run = "pnpm --filter @deskfleet/native build:debug"

[tasks."native:release"]
hide = true
depends = ["install"]
run = "pnpm --filter @deskfleet/native build"

[tasks."daemon:dev"]
description = "Run the standalone headless daemon from TypeScript"
depends = ["native:debug"]
run = "node apps/daemon/src/main.ts"

[tasks."desktop:smoke-dsh"]
description = "Verify DeepSeek Harness on Electron's Node host without staging or system Node"
depends = ["install"]
run = "node apps/desktop/scripts/smoke-dsh.ts"

[tasks."desktop:smoke-packaged-dsh"]
description = "Verify the packaged Electron executable and DeepSeek resources after packaging"
run = "node apps/desktop/scripts/smoke-dsh.ts --packaged"

[tasks."daemon:pack"]
description = "Package the daemon as a Bun single executable"
depends = ["native:release"]
run = "node scripts/build-daemon.ts"

[tasks."daemon:smoke"]
description = "Verify the daemon executable without an installed JavaScript runtime"
run = "node scripts/smoke-daemon.ts"

[tasks."files:benchmark"]
description = "Measure native WebRTC file upload/download throughput with SHA-256 verification"
depends = ["native:debug"]
run = "node scripts/benchmark-files.ts"

[tasks."conversation:benchmark"]
description = "Measure multi-turn Markdown streaming in the production Electron renderer"
run = "node scripts/benchmark-conversation.ts"

[tasks."desktop:dev"]
description = "Run the Electron desktop app with Vite watchers"
depends = ["native:debug", "viewer:build"]
run = "pnpm --filter @deskfleet/desktop dev"

[tasks."viewer:build"]
description = "Build the native remote desktop window"
wait_for = ["native:debug"]
run = "cargo build -p deskfleet-desktop-viewer --bin deskfleet-viewer --locked"

[tasks."viewer:build:android"]
description = "Build and stage the Android native remote desktop viewer library"
run = "node scripts/build-android-viewer.ts"

[tasks."viewer:build:ios"]
description = "Build and stage the iOS native remote desktop viewer XCFramework"
run = "node scripts/build-ios-viewer.ts"

[tasks."desktop:smoke-native-viewer"]
description = "Verify native WebRTC decoding and shallow FIFO window presentation"
depends = ["viewer:build"]
run = ["cargo build -p deskfleet-native --example media_smoke --locked", "node apps/desktop/scripts/smoke-native-viewer.ts"]

[tasks."web:dev"]
description = "Run the Vue Web development server"
depends = ["install"]
run = "pnpm --filter @deskfleet/web dev"

[tasks."web:dev:ios"]
description = "Run the Vue Web development server with Capacitor iOS live reload"
depends = ["install"]
run = "pnpm --filter @deskfleet/web dev:ios"

[tasks."web:dev:android"]
description = "Run the Vue Web development server with Capacitor Android live reload"
depends = ["install"]
run = "pnpm --filter @deskfleet/web dev:android"

[tasks."ios:sync"]
description = "Build the Vue Web client and sync Capacitor iOS plugins and assets"
depends = ["web:build"]
run = "pnpm --filter @deskfleet/web exec cap sync ios"

[tasks."ios:test"]
description = "Sync Capacitor iOS and verify the iOS Simulator build"
depends = ["ios:sync"]
dir = "apps/web/ios/App"
run = "xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build"

[tasks."ios:build"]
description = "Build and archive the release iOS application with Capacitor"
depends = ["web:build"]
env.DESKFLEET_IOS_RELEASE = "1"
run = [
    "pnpm --filter @deskfleet/web exec cap sync ios",
    "node scripts/package-ios-release.ts",
]

[tasks."android:sync"]
description = "Build the Vue Web client and sync Capacitor Android plugins and assets"
depends = ["web:build"]
run = "pnpm --filter @deskfleet/web exec cap sync android"

[tasks."android:test"]
description = "Sync Capacitor Android and run Gradle unit tests"
depends = ["android:sync"]
dir = "apps/web/android"
run = "./gradlew testDebugUnitTest"

[tasks."android:build"]
description = "Build and sign the release Android App Bundle (Google Play) and APK (GitHub Releases) with Capacitor"
depends = ["web:build"]
env.DESKFLEET_ANDROID_RELEASE = "1"
run = [
    "pnpm --filter @deskfleet/web exec cap sync android",
    "pnpm --filter @deskfleet/web exec cap build android --androidreleasetype AAB",
    "pnpm --filter @deskfleet/web exec cap build android --androidreleasetype APK --signing-type apksigner",
]

[tasks."web:build"]
description = "Build the Vue Web client"
depends = ["install"]
run = "pnpm --filter @deskfleet/web build"

[tasks."web:typecheck"]
description = "Check the Web client and shared Vue components"
depends = ["install"]
run = "pnpm --filter @deskfleet/web typecheck"

[tasks."docs:dev"]
description = "Run the VitePress product website and interactive demos"
depends = ["install"]
run = "pnpm --filter @deskfleet/docs dev"

[tasks."docs:build"]
description = "Build the product website and user guide"
depends = ["install"]
run = "pnpm --filter @deskfleet/docs build"

[tasks."docs:preview"]
description = "Preview the built product website"
run = "pnpm --filter @deskfleet/docs preview"

[tasks."docs:typecheck"]
description = "Check the product website and shared component demo types"
depends = ["install"]
run = "pnpm --filter @deskfleet/docs typecheck"

[tasks."desktop:smoke-media"]
description = "Verify Chromium decoding native WebRTC media without screen capture"
depends = ["install"]
run = ["cargo build -p deskfleet-native --example media_smoke --locked", "node apps/desktop/scripts/smoke-media.ts"]

[tasks."desktop:build"]
description = "Build the Electron main, preload, and renderer bundles"
depends = ["native:debug"]
run = "pnpm --filter @deskfleet/desktop build"

[tasks."desktop:smoke-terminal"]
description = "Verify Chromium terminal I/O and PTY reattachment over WebRTC"
depends = ["native:debug"]
run = "node apps/desktop/scripts/smoke-terminal.ts"

[tasks."desktop:smoke-terminal-font"]
description = "Verify real Electron WebGL terminal glyph fonts at high display scale"
run = "node apps/desktop/scripts/smoke-terminal-font.ts"

[tasks."desktop:smoke-proxy"]
description = "Verify Electron sign-in and signaling through a proxy without proxy environment variables"
run = "node apps/desktop/scripts/smoke-proxy.ts"

[tasks."desktop:smoke-native-terminal"]
description = "Verify native PTY spawning inside the Linux Electron main process"
depends = ["native:debug"]
run = "node apps/desktop/scripts/smoke-native-terminal.ts"

[tasks."desktop:smoke-catalog"]
description = "Verify local catalog forms, persistence, and directory terminals in Electron"
depends = ["native:debug", "desktop:build"]
run = "node apps/desktop/scripts/smoke-catalog.ts"

[tasks."desktop:smoke-agent"]
description = "Verify Agent conversations, backlog, steering, permissions, and durable replay in Electron"
depends = ["native:debug", "desktop:build"]
run = "node apps/desktop/scripts/smoke-agent.ts"

[tasks."desktop:smoke-startup"]
description = "Verify the actual Electron package entry and bundled ACP adapter startup"
depends = ["desktop:build"]
run = "node apps/desktop/scripts/smoke-startup.ts"

[tasks."desktop:smoke-appearance"]
description = "Verify Appearance controls, native theme, CSS fonts, and restart persistence in Electron"
depends = ["desktop:build"]
run = "node apps/desktop/scripts/smoke-appearance.ts"

[tasks."desktop:smoke-updates"]
description = "Verify update consent, progress, retry, shutdown ordering, and sidebar UI in Electron"
depends = ["desktop:build"]
run = "node apps/desktop/scripts/smoke-updates.ts"

[tasks."desktop:smoke-local-agent"]
description = "Verify Settings startup, shutdown, and the hosted local Agent lifetime in Electron"
depends = ["native:debug", "desktop:build"]
run = "node apps/desktop/scripts/smoke-local-agent.ts"

[tasks."desktop:package"]
description = "Package the desktop app as installers for the host platform"
depends = ["desktop:release-build"]
run = "pnpm --filter @deskfleet/desktop run package"

[tasks."desktop:package:dir"]
description = "Package the desktop app as an unpacked directory for the host platform"
depends = ["desktop:release-build"]
run = "pnpm --filter @deskfleet/desktop run package:dir"

[tasks."desktop:release-build"]
hide = true
depends = ["native:release"]
run = "pnpm --filter @deskfleet/desktop build"

[tasks."rust:format"]
hide = true
run = "cargo fmt --all"

[tasks."rust:format:check"]
hide = true
run = "cargo fmt --all -- --check"

[tasks."rust:shear"]
hide = true
run = "cargo shear --locked"

[tasks."rust:clippy"]
hide = true
wait_for = ["native:debug"]
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."rust:test"]
hide = true
# Serialize Cargo tasks sharing target/ only when both are scheduled.
wait_for = ["native:debug", "rust:clippy"]
run = "cargo test --workspace --locked"

[tasks."rust:build"]
hide = true
wait_for = ["native:debug", "rust:clippy", "rust:test"]
run = "cargo build --workspace --locked"

[tasks."check:rust-skills-harness"]
hide = true
run = "node scripts/check-rust-skills-harness.ts"

[tasks."check:pnpm-patches"]
description = "Validate pnpm patchedDependencies against Renovate and the lockfile"
run = "node scripts/check-pnpm-patches.ts"

[tasks."check:static"]
hide = true
depends = [
    "check:rust-skills-harness",
    "check:pnpm-patches",
    "check:types",
    "check:desktop-types",
    "web:typecheck",
    "docs:typecheck",
    "rust:format:check",
    "rust:shear",
    "rust:clippy",
]

[tasks."check:types"]
hide = true
depends = ["native:debug"]
run = "pnpm typecheck"

[tasks."check:desktop-types"]
hide = true
depends = ["native:debug"]
run = "pnpm --filter @deskfleet/desktop typecheck"

[tasks."check:daemon"]
hide = true
depends = ["native:debug"]
# Both suites create many SQLite catalogs; avoid competing for runner storage.
wait_for = ["rust:test"]
run = "node --test apps/daemon/src/*.test.ts packages/agents/*/src/*.test.ts packages/mcp/src/*.test.ts"

[tasks."check:desktop"]
hide = true
depends = ["install"]
# Each suite sizes its own worker pool. Keep renderer deadlines independent of
# concurrent native compilation and daemon tests; focused desktop runs stay standalone.
wait_for = ["native:debug", "rust:test", "check:daemon"]
run = "pnpm --filter @deskfleet/desktop test"

[tasks."ci:check:desktop-main"]
hide = true
depends = ["install"]
wait_for = ["native:debug", "rust:test", "check:daemon"]
# This project includes Electron main, shared modules, and client tests.
run = "pnpm --filter @deskfleet/desktop test --project main"

[tasks."check:scripts"]
hide = true
depends = ["install"]
run = "node --test scripts/*.test.ts packages/dsh-runtime/src/*.test.ts"

[tasks."check:rust-tests"]
hide = true
depends = ["rust:test"]

# CI splits `check:static` and the bundle builds by cost. Preflight needs no
# Rust compilation and gates the platform tests; the rest runs beside them.
[tasks."spec:test"]
description = "Typecheck and simulate the Quint control-plane models"
run = "node scripts/check-specs.ts"

[tasks."spec:verify"]
description = "Symbolically check each control-plane model to its recorded step bound"
run = """
set -eu
quint verify specs/grant_lifecycle.qnt --max-steps 6 --invariants \
  inv_binding_stable inv_outage_keeps_established inv_sealed_stays_closed \
  inv_reservation_required inv_single_claim inv_transport_separation \
  inv_expiry_not_extended inv_accepted_work_survives
quint verify specs/route_fence.qnt --max-steps 6 --invariants \
  inv_route_identity inv_authority_follows_lease inv_snapshot_before_grant \
  inv_reconcile_closes_captured inv_one_snapshot inv_queue_bounded \
  inv_offer_stable inv_route_survives inv_inbox
quint verify specs/rpc_replacement.qnt --max-steps 10 --invariants \
  inv_pending_on_current_socket inv_reply_matches_admission \
  inv_forwarded_failure_belongs_to_displaced_socket inv_old_close_keeps_new_route
quint verify specs/mux_streams.qnt --max-steps 6 --invariants \
  inv_grant_stable inv_release_closes_streams inv_legacy_before_business \
  inv_accepted_work_survives
quint verify specs/link_liveness.qnt --max-steps 6 --invariants \
  inv_client_identity inv_daemon_identity inv_link_phases \
  inv_peer_close inv_expiry_fixed
quint verify specs/credential_close.qnt --max-steps 6 --invariants \
  inv_expiry_fixed inv_accepted_work_survives inv_close_cause \
  inv_revoked_closes inv_reenrolled_stays_closed inv_credential_domain
quint verify specs/local_claim.qnt --max-steps 6 --invariants \
  inv_blank inv_local_spent inv_webrtc_unspent inv_prepared \
  inv_claimed inv_sealed inv_domain
quint verify specs/revocation_cleanup.qnt --max-steps 11 --invariants \
  inv_healthy_enroll_succeeds inv_settles_after_both inv_resolved_is_clean \
  inv_revoked_has_cleanup inv_closed_after_close inv_attempt inv_domain
quint verify specs/offer_revocation.qnt --max-steps 9 --invariants \
  inv_revocation_is_prompt inv_failed_setup_closes inv_failed_revokes \
  inv_closed_after_revocation inv_one_offer inv_commit_follows_answer inv_domain
quint verify specs/recovery_admission.qnt --max-steps 10 --invariants \
  inv_current_roster_before_dispatch inv_existing_work_survives inv_domain
quint verify specs/peer_creation_failure.qnt --max-steps 4 --invariants \
  inv_primary_error_preserved inv_notification_follows_revoke \
  inv_failed_notice_keeps_revocation inv_no_false_cleanup_success inv_domain
"""

[tasks."ci:preflight"]
hide = true
depends = [
    "check:rust-skills-harness",
    "check:pnpm-patches",
    "rust:format:check",
    "rust:shear",
    "check:scripts",
    "spec:test",
    "web:typecheck",
    "docs:typecheck",
]

[tasks."ci:check:static"]
hide = true
depends = ["check:types", "check:desktop-types", "rust:clippy", "desktop:build", "web:build", "docs:build"]
