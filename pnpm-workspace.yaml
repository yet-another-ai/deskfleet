packages:
  - apps/daemon
  - apps/desktop
  - crates/node
  - apps/web
  - packages/capacitor-bridge
  - packages/client
  - packages/components
  - packages/dsh-runtime
  - packages/mcp
  - docs

allowBuilds:
  # DSH native subprocess helpers and FFI; the other hooks are optional notices.
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: true
  node-pty: true
  protobufjs: false
  # Platform packages supply the binary; do not run the CLI's download fallback.
  '@sentry/cli': false
  # Squirrel.Windows support; electron-builder's NSIS target does not use it.
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@intlify/bundle-utils@11.2.8'
  - '@intlify/unplugin-vue-i18n@11.2.8'
  - '@lucide/vue@1.62.0'
  - '@proj-airi/cap-vite@0.15.1'

overrides:
  # The docs render the same Vue components as the desktop and Web clients.
  'vitepress>vue': '3.6.0-rc.14'

# Exact pins require a Renovate npm disable rule (manual rebase). `@*` keys
# survive Renovate version bumps; pnpm still fails the install if the patch no
# longer applies, which is the intended fixable path.
patchedDependencies:
  '@agentclientprotocol/claude-agent-acp@*': patches/@agentclientprotocol__claude-agent-acp.patch
  '@agentclientprotocol/codex-acp@2.3.0': patches/@agentclientprotocol__codex-acp@2.3.0.patch
  '@deepseek-ai/dsh-app-boot@*': patches/@deepseek-ai__dsh-app-boot.patch
  '@xterm/addon-ligatures@*': patches/@xterm__addon-ligatures.patch
  '@xterm/addon-search@*': patches/@xterm__addon-search.patch
  '@xterm/addon-webgl@*': patches/@xterm__addon-webgl.patch
  pi-acp@0.0.34: patches/pi-acp@0.0.34.patch
  stream-markdown-parser@*: patches/stream-markdown-parser.patch
