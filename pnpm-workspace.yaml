packages:
  - apps/daemon
  - apps/desktop
  - crates/node
  - apps/web
  - packages/client
  - packages/components
  - packages/mcp
  - docs

allowBuilds:
  # Squirrel.Windows support; electron-builder's NSIS target does not use it.
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@lobehub/icons-static-svg@1.99.0'

overrides:
  # The docs render the same Vue components as the desktop and Web clients.
  'vitepress>vue': '3.6.0-rc.13'

patchedDependencies:
  '@agentclientprotocol/codex-acp@2.2.2': patches/@agentclientprotocol__codex-acp@2.2.2.patch
  '@xterm/addon-ligatures@0.10.0': patches/@xterm__addon-ligatures@0.10.0.patch
  pi-acp@0.0.34: patches/pi-acp@0.0.34.patch
