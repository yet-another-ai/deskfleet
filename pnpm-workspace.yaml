packages:
  - apps/daemon
  - apps/desktop
  - crates/node
  - apps/web
  - packages/capacitor-native-desktop
  - packages/client
  - packages/components
  - packages/dsh-runtime
  - packages/mcp
  - docs

allowBuilds:
  # DSH native subprocess helpers and FFI; the other hooks are optional notices.
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: true
  node-pty: true
  protobufjs: false
  # Platform packages supply the binary; do not run the CLI's download fallback.
  '@sentry/cli': false
  # Squirrel.Windows support; electron-builder's NSIS target does not use it.
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@intlify/bundle-utils@11.2.8'
  - '@intlify/unplugin-vue-i18n@11.2.8'
  - '@lucide/vue@1.62.0'
  - '@proj-airi/cap-vite@0.15.1'

overrides:
  # The docs render the same Vue components as the desktop and Web clients.
  'vitepress>vue': '3.6.0-rc.14'

patchedDependencies:
  '@agentclientprotocol/claude-agent-acp@0.101.0': patches/@agentclientprotocol__claude-agent-acp@0.101.0.patch
  '@agentclientprotocol/codex-acp@2.3.0': patches/@agentclientprotocol__codex-acp@2.3.0.patch
  '@deepseek-ai/dsh-app-boot@0.2.2-rc.1': patches/@deepseek-ai__dsh-app-boot@0.2.2-rc.1.patch
  '@xterm/addon-ligatures@0.10.0': patches/@xterm__addon-ligatures@0.10.0.patch
  '@xterm/addon-search@0.16.0': patches/@xterm__addon-search@0.16.0.patch
  '@xterm/addon-webgl@0.19.0': patches/@xterm__addon-webgl@0.19.0.patch
  pi-acp@0.0.34: patches/pi-acp@0.0.34.patch
  stream-markdown-parser@1.2.25: patches/stream-markdown-parser@1.2.25.patch
